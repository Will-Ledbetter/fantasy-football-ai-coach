<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix Draft Room — Live Sleeper Draft Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e1a; color: #e0e0e0; min-height: 100vh; }
        
        .header { background: linear-gradient(135deg, #1a1f3a, #2d1b69); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #6c3fcf; }
        .header h1 { font-size: 1.3rem; color: #fff; }
        .header h1 span { color: #a78bfa; }
        .live-badge { background: #dc2626; color: white; font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; animation: pulse-live 2s infinite; margin-left: 10px; }
        @keyframes pulse-live { 0%,100%{opacity:1} 50%{opacity:0.6} }
        .header-right { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        .header-right select, .header-right input { background: #1e2340; border: 1px solid #3d4570; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; }
        .round-info { color: #c4b5fd; font-weight: 600; }
        .your-turn { color: #10b981; font-weight: 700; }
        .my-slot-badge { background: #fbbf24; color: #000; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }

        /* Connect Screen */
        .connect-screen { max-width: 480px; margin: 80px auto; padding: 24px; text-align: center; }
        .connect-screen h1 { font-size: 2rem; margin-bottom: 8px; }
        .connect-screen p { color: #9ca3af; margin-bottom: 24px; }
        .connect-form { background: #111627; border: 1px solid #2d3555; border-radius: 12px; padding: 24px; text-align: left; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #a78bfa; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px 14px; background: #0a0e1a; border: 1px solid #3d4570; border-radius: 8px; color: #fff; font-size: 0.9rem; }
        .input-group input:focus { outline: none; border-color: #6c3fcf; }
        .input-group .hint { font-size: 0.72rem; color: #6b7280; margin-top: 3px; }
        .connect-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #6c3fcf, #4f46e5); border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .connect-btn:hover { box-shadow: 0 4px 12px rgba(108,63,207,0.4); }
        .connect-btn:disabled { opacity: 0.5; }
        .error-msg { background: #2c0b0b; border: 1px solid #dc2626; color: #fca5a5; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 12px; }

        /* Main Layout */
        .main-layout { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 52px); overflow: hidden; }
        
        /* Board */
        .board-section { padding: 12px; overflow-y: auto; }
        .board-section h2 { font-size: 1rem; color: #a78bfa; margin-bottom: 8px; }
        .picks-list { display: flex; flex-direction: column; gap: 3px; }
        .pick-row { display: grid; grid-template-columns: 48px 38px 1fr 44px 110px; align-items: center; gap: 6px; padding: 7px 10px; background: #111627; border-radius: 5px; font-size: 0.8rem; border: 1px solid transparent; }
        .pick-row.mine { background: #1a1040; border-color: #fbbf24; }
        .pick-num { color: #6b7280; font-weight: 700; font-size: 0.72rem; }
        .pick-pos { font-weight: 700; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; text-align: center; }
        .pos-QB { color: #ef4444; background: #2c0b0b; } .pos-RB { color: #10b981; background: #052e16; }
        .pos-WR { color: #3b82f6; background: #0c1929; } .pos-TE { color: #f59e0b; background: #422006; }
        .pos-K { color: #8b5cf6; background: #1e1040; } .pos-DEF { color: #6b7280; background: #1f2937; }
        .pick-name { font-weight: 600; color: #fff; } .pick-team { color: #9ca3af; font-size: 0.72rem; }
        .pick-drafter { color: #6b7280; font-size: 0.7rem; text-align: right; }

        /* Right Panel */
        .right-panel { background: #111627; border-left: 1px solid #2d3555; display: flex; flex-direction: column; overflow: hidden; }
        .panel-tabs { display: flex; border-bottom: 1px solid #2d3555; }
        .panel-tabs button { flex: 1; padding: 10px; background: none; border: none; color: #6b7280; font-weight: 600; font-size: 0.8rem; cursor: pointer; border-bottom: 2px solid transparent; }
        .panel-tabs button.active { color: #a78bfa; border-bottom-color: #a78bfa; }
        .panel-content { flex: 1; overflow-y: auto; padding: 12px; }
        .strategy-box { background: #1a2040; border: 1px solid #3d4570; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 0.8rem; line-height: 1.5; color: #c4b5fd; white-space: pre-line; }
        .pos-filters { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        .pos-filters button { padding: 3px 9px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; cursor: pointer; border: 1px solid #3d4570; background: transparent; color: #9ca3af; }
        .pos-filters button.active { background: #6c3fcf; color: white; border-color: #6c3fcf; }
        .rec-card { background: #1a1f3a; border: 1px solid #2d3555; border-radius: 8px; padding: 9px 11px; margin-bottom: 5px; }
        .rec-card.top { border-color: #fbbf24; background: #1a1a10; }
        .rec-header { display: flex; align-items: center; gap: 8px; }
        .rec-name { font-weight: 700; font-size: 0.88rem; color: #fff; }
        .rec-details { display: flex; gap: 10px; margin-top: 3px; font-size: 0.73rem; color: #9ca3af; }
        .rec-tag { font-size: 0.7rem; color: #fbbf24; margin-top: 3px; font-style: italic; }
        .rec-reason { font-size: 0.7rem; color: #a78bfa; margin-top: 2px; }
        .strategy-picker { display: flex; flex-direction: column; gap: 6px; }
        .strat-option { padding: 10px 12px; border: 1px solid #3d4570; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
        .strat-option:hover { border-color: #6c3fcf; }
        .strat-option.selected { border-color: #fbbf24; background: #1a1a10; }
        .strat-option strong { display: block; font-size: 0.85rem; color: #fff; margin-bottom: 2px; }
        .strat-option span { font-size: 0.73rem; color: #9ca3af; }
        .change-strat-btn { background: #374151; border: none; color: #e0e0e0; padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; }
        .change-strat-btn:hover { background: #4b5563; }
        .squad-row { display: grid; grid-template-columns: 44px 38px 1fr 44px; align-items: center; gap: 6px; padding: 6px 10px; background: #1a1f3a; border-radius: 5px; margin-bottom: 3px; font-size: 0.8rem; }
        .squad-counts { background: #1a1f3a; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .squad-counts h4 { font-size: 0.82rem; color: #a78bfa; margin-bottom: 6px; }
        .count-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.8rem; }
        .waiting { color: #6b7280; font-style: italic; text-align: center; padding: 20px; }
        
        @media(max-width:900px) { .main-layout { grid-template-columns: 1fr; } .right-panel { border-left: none; border-top: 1px solid #2d3555; max-height: 50vh; } }
    </style>
</head>
<body>
<div id="app"></div>
<script>
const SLEEPER = 'https://api.sleeper.app/v1';
let state = {
    connected: false, loading: false, error: '',
    leagueId: localStorage.getItem('nflDraftLeagueId') || '',
    draftId: localStorage.getItem('nflDraftId') || '',
    draft: null, picks: [], players: null,
    leagueUsers: [], mySlot: parseInt(localStorage.getItem('nflDraftMySlot')) || null,
    tab: 'recs', posFilter: 'ALL', recs: [], strategy: ''
};
let pollInterval = null;

// Load NFL players
fetch(`${SLEEPER}/players/nfl`).then(r => r.json()).then(d => { state.players = d; render(); });

function render() {
    const app = document.getElementById('app');
    if (!state.connected) { app.innerHTML = renderConnect(); return; }
    app.innerHTML = renderDraftRoom();
}

function renderConnect() {
    return `
    <div class="connect-screen">
        <h1>🏈 Helix <span style="color:#a78bfa">Draft Room</span></h1>
        <p>Connect live to your Sleeper draft for AI-powered pick recommendations</p>
        <div class="connect-form">
            <div class="input-group">
                <label>Sleeper League ID</label>
                <input id="leagueInput" value="${state.leagueId}" placeholder="e.g., 1048789234567890" />
                <div class="hint">In Sleeper → League Settings → scroll to bottom for League ID</div>
            </div>
            <div class="input-group">
                <label>Or Direct Draft ID (optional)</label>
                <input id="draftInput" value="${state.draftId}" placeholder="If you have the draft ID directly" />
            </div>
            <div class="input-group">
                <label>Draft Strategy</label>
                <div class="strategy-picker">
                    ${Object.entries(STRATEGIES).map(([key, s]) => `
                        <div class="strat-option ${currentStrategy === key ? 'selected' : ''}" onclick="pickStrategy('${key}')">
                            <strong>${s.name}</strong>
                            <span>${s.desc}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
            ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
            <button class="connect-btn" onclick="connect()" ${state.loading ? 'disabled' : ''}>
                ${state.loading ? 'Connecting...' : '⚡ Connect to Draft'}
            </button>
        </div>
    </div>`;
}

function renderDraftRoom() {
    const round = getCurrentRound();
    const pick = getCurrentPick();
    const myTurn = isMyTurn();
    
    return `
    <div class="header">
        <div style="display:flex;align-items:center;gap:10px">
            <h1>🏈 Helix <span>Draft Room</span></h1>
            <span class="live-badge">● LIVE</span>
        </div>
        <div class="header-right">
            <span class="round-info">Rd ${round} • Pick ${pick}${myTurn ? '<span class="your-turn"> — YOUR PICK!</span>' : ''}</span>
            ${!state.mySlot ? `<select onchange="setSlot(this.value)"><option value="">Set my slot</option>${Array.from({length: state.draft.settings.teams},(_,i)=>`<option value="${i+1}">Slot ${i+1}</option>`).join('')}</select>` : `<span class="my-slot-badge">My Slot: #${state.mySlot}</span>`}
            <button class="change-strat-btn" onclick="changeStrategy()">🔄 Strategy</button>
        </div>
    </div>
    <div class="main-layout">
        <div class="board-section">
            <h2>Draft Board (${state.picks.length} picks)</h2>
            <div class="picks-list">
                ${state.picks.length === 0 ? '<div class="waiting">Waiting for draft to start...</div>' : ''}
                ${[...state.picks].reverse().map(p => {
                    const pl = state.players?.[p.player_id];
                    const isMe = p.draft_slot === state.mySlot;
                    return `<div class="pick-row ${isMe ? 'mine' : ''}">
                        <span class="pick-num">${p.round}.${p.pick_no || p.draft_slot}</span>
                        <span class="pick-pos pos-${pl?.position||'?'}">${pl?.position||'??'}</span>
                        <span class="pick-name">${pl ? pl.first_name+' '+pl.last_name : p.player_id}</span>
                        <span class="pick-team">${pl?.team||''}</span>
                        <span class="pick-drafter">${getDrafterName(p)}</span>
                    </div>`;
                }).join('')}
            </div>
        </div>
        <div class="right-panel">
            <div class="panel-tabs">
                <button class="${state.tab==='recs'?'active':''}" onclick="switchTab('recs')">Recommendations</button>
                <button class="${state.tab==='squad'?'active':''}" onclick="switchTab('squad')">My Squad</button>
            </div>
            <div class="panel-content">
                ${state.tab === 'recs' ? renderRecs() : renderSquad()}
            </div>
        </div>
    </div>`;
}

function renderRecs() {
    const filtered = state.posFilter === 'ALL' ? state.recs : state.recs.filter(r => r.position === state.posFilter);
    return `
        ${state.strategy ? `<div class="strategy-box">${state.strategy}</div>` : ''}
        <div class="pos-filters">
            ${['ALL','QB','RB','WR','TE','K','DEF'].map(p => `<button class="${state.posFilter===p?'active':''}" onclick="filterPos('${p}')">${p}</button>`).join('')}
        </div>
        <div>
            ${filtered.length === 0 ? '<div class="waiting">Waiting for picks to generate recs...</div>' : ''}
            ${filtered.slice(0,15).map((r,i) => `
                <div class="rec-card ${i===0?'top':''}">
                    <div class="rec-header">
                        <span class="pick-pos pos-${r.position}">${r.position}</span>
                        <span class="rec-name">${r.name}</span>
                    </div>
                    <div class="rec-details">
                        <span>${r.team}</span>
                        <span>ADP: ${r.adp}</span>
                        ${r.age ? `<span>Age: ${r.age}</span>` : ''}
                    </div>
                    ${i===0 ? '<div class="rec-tag">★ Top recommendation</div>' : ''}
                    ${r.reason ? `<div class="rec-reason">${r.reason}</div>` : ''}
                </div>
            `).join('')}
        </div>`;
}

function renderSquad() {
    const myPicks = getMyPicks();
    const counts = getSquadCounts();
    return `
        <h3 style="font-size:0.9rem;color:#a78bfa;margin-bottom:8px">My Picks (${myPicks.length})</h3>
        ${myPicks.length === 0 ? '<div class="waiting">No picks yet</div>' : ''}
        ${myPicks.map(p => {
            const pl = state.players?.[p.player_id];
            return `<div class="squad-row">
                <span class="pick-num">Rd ${p.round}</span>
                <span class="pick-pos pos-${pl?.position||'?'}">${pl?.position||'?'}</span>
                <span class="pick-name">${pl ? pl.first_name+' '+pl.last_name : p.player_id}</span>
                <span class="pick-team">${pl?.team||''}</span>
            </div>`;
        }).join('')}
        <div class="squad-counts">
            <h4>Roster Breakdown</h4>
            ${Object.entries(counts).map(([pos,c]) => `<div class="count-row"><span class="pos-${pos}">${pos}</span><span>${c}</span></div>`).join('')}
        </div>`;
}

// Logic
function getCurrentRound() { return state.draft ? Math.floor(state.picks.length / state.draft.settings.teams) + 1 : 1; }
function getCurrentPick() { return state.draft ? (state.picks.length % state.draft.settings.teams) + 1 : 1; }
function isMyTurn() {
    if (!state.draft || !state.mySlot) return false;
    const round = getCurrentRound();
    const pickInRound = state.picks.length % state.draft.settings.teams;
    if (state.draft.type === 'snake') {
        return round % 2 === 1 ? (pickInRound + 1) === state.mySlot : (state.draft.settings.teams - pickInRound) === state.mySlot;
    }
    return (pickInRound + 1) === state.mySlot;
}
function getMyPicks() { return state.mySlot ? state.picks.filter(p => p.draft_slot === state.mySlot) : []; }
function getSquadCounts() {
    const counts = { QB:0, RB:0, WR:0, TE:0, K:0, DEF:0 };
    getMyPicks().forEach(p => { const pl = state.players?.[p.player_id]; if (pl && counts[pl.position] !== undefined) counts[pl.position]++; });
    return counts;
}
function getDrafterName(pick) {
    const u = state.leagueUsers.find(u => u.user_id === pick.picked_by);
    return u?.metadata?.team_name || u?.display_name || `Slot ${pick.draft_slot}`;
}

// ============================================================
// DRAFT STRATEGY ENGINE
// ============================================================
// Core strategies user can choose from — each shapes the entire draft approach
const STRATEGIES = {
    'hero-rb': {
        name: '🦸 Hero RB',
        desc: 'Lock in one elite RB early, then hammer WRs in rounds 2-5. Build WR depth and grab RB2 later.',
        plan: { 1: 'RB', 2: 'WR', 3: 'WR', 4: 'WR', 5: 'WR', 6: 'RB', 7: 'TE/QB', 8: 'RB', 9: 'WR', 10: 'QB/RB' },
        weights: { RB: [100, 30, 30, 30, 30, 80, 40, 70, 30, 40], WR: [40, 100, 100, 90, 80, 40, 40, 30, 70, 40] }
    },
    'zero-rb': {
        name: '🚫 Zero RB',
        desc: 'Load up on elite WRs/TEs early. RBs in later rounds — target upside and handcuffs.',
        plan: { 1: 'WR', 2: 'WR', 3: 'WR/TE', 4: 'WR', 5: 'QB/TE', 6: 'RB', 7: 'RB', 8: 'RB', 9: 'RB', 10: 'WR' },
        weights: { RB: [20, 20, 20, 30, 30, 100, 90, 80, 70, 30], WR: [100, 100, 80, 90, 50, 30, 30, 30, 30, 70] }
    },
    'robust-rb': {
        name: '💪 Robust RB',
        desc: 'Two RBs in first 3 rounds. Secure the scarce position, then fill WR mid-rounds.',
        plan: { 1: 'RB', 2: 'RB', 3: 'RB/WR', 4: 'WR', 5: 'WR', 6: 'WR/TE', 7: 'QB', 8: 'WR', 9: 'RB', 10: 'WR' },
        weights: { RB: [100, 90, 70, 30, 30, 30, 30, 30, 70, 30], WR: [30, 40, 60, 100, 90, 70, 40, 80, 30, 70] }
    },
    'balanced': {
        name: '⚖️ Balanced / BPA',
        desc: 'Best player available with slight positional need adjustments. Flexible — adapt to what falls.',
        plan: { 1: 'BPA', 2: 'BPA', 3: 'BPA', 4: 'BPA', 5: 'BPA', 6: 'BPA', 7: 'BPA', 8: 'BPA', 9: 'BPA', 10: 'BPA' },
        weights: { RB: [70, 70, 60, 60, 50, 50, 40, 40, 40, 40], WR: [70, 70, 60, 60, 50, 50, 40, 40, 40, 40] }
    },
    'anchor-te': {
        name: '🎯 Anchor TE',
        desc: 'Secure a top-3 TE early (rounds 2-3). Elite TEs are scarce — lock the positional edge.',
        plan: { 1: 'RB/WR', 2: 'TE', 3: 'WR/TE', 4: 'RB', 5: 'WR', 6: 'WR', 7: 'QB', 8: 'RB', 9: 'WR', 10: 'RB' },
        weights: { RB: [80, 30, 40, 90, 30, 30, 30, 80, 30, 70], WR: [80, 30, 60, 40, 90, 80, 40, 30, 70, 30], TE: [20, 100, 80, 20, 20, 20, 20, 20, 20, 20] }
    }
};

let currentStrategy = localStorage.getItem('nflDraftStrategy') || null;

function generateRecs() {
    if (!state.players || !state.draft) return;
    const taken = new Set(state.picks.map(p => p.player_id));
    const counts = getSquadCounts();
    const round = getCurrentRound();
    const totalRounds = state.draft.settings.rounds || 15;
    const rosterSlots = state.draft.settings.roster_positions || [];
    const strat = currentStrategy ? STRATEGIES[currentStrategy] : STRATEGIES['balanced'];

    const available = Object.entries(state.players)
        .filter(([id, p]) => !taken.has(id) && p.active && ['QB','RB','WR','TE','K','DEF'].includes(p.position) && p.team)
        .map(([id, p]) => ({ playerId: id, name: `${p.first_name} ${p.last_name}`, position: p.position, team: p.team, adp: p.search_rank || 9999, age: p.age }))
        .sort((a,b) => a.adp - b.adp)
        .slice(0, 250);

    const scored = available.map(p => {
        let score = 1000 - p.adp;
        
        // Strategy weight for this round
        const roundIdx = Math.min(round - 1, 9);
        const stratWeights = strat.weights || {};
        const posWeight = (stratWeights[p.position] && stratWeights[p.position][roundIdx]) || 50;
        score += (posWeight - 50) * 1.5; // Normalize around 0, amplify

        // Positional need based on roster slots
        const flexPositions = rosterSlots.filter(s => ['FLEX','SUPER_FLEX','REC_FLEX','WRRB_FLEX'].includes(s)).length;
        const needed = {
            QB: rosterSlots.filter(s => s === 'QB' || s === 'SUPER_FLEX').length + 1,
            RB: rosterSlots.filter(s => s === 'RB').length + Math.ceil(flexPositions * 0.5) + 2,
            WR: rosterSlots.filter(s => s === 'WR').length + Math.ceil(flexPositions * 0.5) + 2,
            TE: rosterSlots.filter(s => s === 'TE' || s === 'REC_FLEX').length + 1,
            K: rosterSlots.filter(s => s === 'K').length,
            DEF: rosterSlots.filter(s => s === 'DEF').length
        };
        
        // Boost if still need starters at this position
        if (counts[p.position] < (needed[p.position] || 1)) score += 30;
        // Penalize overstocking early
        if (round <= 6 && counts[p.position] >= (needed[p.position] || 3)) score -= 40;

        // Never draft K/DEF early
        if (round <= totalRounds - 3 && (p.position === 'K' || p.position === 'DEF')) score -= 150;
        // Force K/DEF at end if needed
        if (round >= totalRounds - 1 && p.position === 'K' && counts.K === 0) score += 80;
        if (round >= totalRounds - 1 && p.position === 'DEF' && counts.DEF === 0) score += 80;

        // Value detection: if a player's ADP says they should be gone by now, they're a steal
        const expectedPickForAdp = p.adp;
        const currentOverallPick = state.picks.length + 1;
        if (expectedPickForAdp < currentOverallPick - 5) score += 25; // Fallen player bonus

        // QB scarcity adjustment — in 1QB leagues, don't overdraft
        if (p.position === 'QB' && counts.QB >= 1 && !rosterSlots.includes('SUPER_FLEX')) score -= 60;

        return { ...p, score, reason: getPickReason(p, strat, round, counts, expectedPickForAdp < currentOverallPick - 5) };
    });

    scored.sort((a,b) => b.score - a.score);
    state.recs = scored.slice(0, 20);

    // Strategy note
    let s = isMyTurn() ? '🟢 YOUR PICK NOW!\n\n' : '';
    s += `📋 Strategy: ${strat.name}\n`;
    const planTarget = strat.plan[round] || strat.plan[10] || 'BPA';
    s += `Round ${round} target: ${planTarget}\n\n`;

    // Pivot detection
    const topRec = state.recs[0];
    if (topRec && planTarget !== 'BPA' && !planTarget.includes(topRec.position)) {
        s += `⚡ PIVOT ALERT: ${topRec.name} (${topRec.position}) has fallen — consider taking value over plan!\n\n`;
    }

    // Positional warnings
    if (round >= 7 && counts.QB === 0) s += '⚠️ No QB yet — target one soon\n';
    if (round >= 9 && counts.TE === 0) s += '⚠️ No TE yet — options thinning\n';
    if (round >= totalRounds - 1 && counts.K === 0) s += '⚠️ Need K!\n';
    if (round >= totalRounds - 1 && counts.DEF === 0) s += '⚠️ Need DEF!\n';

    // Roster progress
    const totalNeeded = Object.values(needed).reduce((a,b) => a + b, 0);
    const totalHave = Object.values(counts).reduce((a,b) => a + b, 0);
    s += `\n📊 Roster: ${totalHave}/${totalRounds} picks made`;

    state.strategy = s;
}

function getPickReason(player, strat, round, counts, isFallen) {
    if (isFallen) return '📉 Fallen value — steal!';
    const planTarget = strat.plan[round] || 'BPA';
    if (planTarget.includes(player.position)) return `✅ Matches ${strat.name} round ${round} plan`;
    if (player.adp <= state.picks.length + 3) return '🔥 Top ADP — won\'t last';
    if (counts[player.position] === 0 && round >= 5) return `📌 First ${player.position} — fill the need`;
    return '';
}

// Actions
async function connect() {
    state.leagueId = document.getElementById('leagueInput').value.trim();
    state.draftId = document.getElementById('draftInput').value.trim();
    state.loading = true; state.error = ''; render();

    try {
        let did = state.draftId;
        if (state.leagueId && !did) {
            const drafts = await fetch(`${SLEEPER}/league/${state.leagueId}/drafts`).then(r => r.json());
            if (!drafts || drafts.length === 0) throw new Error('No drafts found for this league');
            const active = drafts.find(d => d.status === 'drafting') || drafts[0];
            did = active.draft_id;
            state.draftId = did;
        }
        if (!did) throw new Error('Provide a League ID or Draft ID');

        state.draft = await fetch(`${SLEEPER}/draft/${did}`).then(r => r.json());
        const lid = state.draft.league_id || state.leagueId;
        if (lid) { state.leagueId = lid; state.leagueUsers = await fetch(`${SLEEPER}/league/${lid}/users`).then(r => r.json()) || []; }
        state.picks = await fetch(`${SLEEPER}/draft/${did}/picks`).then(r => r.json()) || [];
        state.connected = true;

        localStorage.setItem('nflDraftLeagueId', state.leagueId);
        localStorage.setItem('nflDraftId', did);

        generateRecs();
        pollInterval = setInterval(poll, 3000);
    } catch(e) { state.error = e.message; }
    state.loading = false; render();
}

async function poll() {
    try {
        const prev = state.picks.length;
        state.picks = await fetch(`${SLEEPER}/draft/${state.draftId}/picks`).then(r => r.json()) || [];
        if (state.picks.length !== prev) { generateRecs(); render(); }
    } catch(e) {}
}

function setSlot(v) { state.mySlot = parseInt(v); localStorage.setItem('nflDraftMySlot', v); generateRecs(); render(); }
function switchTab(t) { state.tab = t; render(); }
function filterPos(p) { state.posFilter = p; render(); }
function pickStrategy(key) { currentStrategy = key; localStorage.setItem('nflDraftStrategy', key); render(); }
function changeStrategy() {
    const keys = Object.keys(STRATEGIES);
    const choice = prompt('Switch strategy to:\n' + keys.map((k,i) => `${i+1}. ${STRATEGIES[k].name}`).join('\n') + '\n\nEnter number:');
    if (choice && keys[parseInt(choice)-1]) {
        currentStrategy = keys[parseInt(choice)-1];
        localStorage.setItem('nflDraftStrategy', currentStrategy);
        generateRecs();
        render();
    }
}

render();
</script>
